name: Phase 0C browser evidence
on:
  push:
    branches: [phase/00-finzefy-authority-ui-bootstrap, phase/0i-frontend-finance-workflows, 'review/**']
  pull_request:
    branches: ['phase/**', 'review/**']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright test runner
        run: |
          mkdir -p /tmp/octalve-playwright
          npm install --prefix /tmp/octalve-playwright --no-audit --no-fund playwright@1.56.1
          /tmp/octalve-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start production-mode Preview
        run: |
          pnpm build
          pnpm start --port 3000 > /tmp/octalve-next.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/octalve-next.log
          exit 1
      - name: Ensure native PDF text, page and PNG tools
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Z02 catalogue and draft milestone browser acceptance
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0z02-shared-domain-browser.cjs
      - name: Dialog and bottom-sheet invisible scrollbars browser evidence
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0i-dialog-scroll-acceptance.cjs
      - name: Z02 shared customer/item/tax/payment browser acceptance
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0z02-domain-browser.cjs
      - name: Z03 invoice delivery and quotation lifecycle browser acceptance
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0z03-lifecycle-browser.cjs
      - name: Z04 three-experience access-readiness browser acceptance
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0z04-access-browser.cjs
      - name: Merchant shared header and isolated search browser evidence
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0y-merchant-nav-evidence.cjs
      - name: Merchant fixed-navbar and main-scroll geometry qualification
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0y1-navbar-geometry.cjs
      - name: Human-path browser-only walkthrough
        if: success()
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0x-human-browser-walkthrough.cjs
      - name: Browser/screenshots regression
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0c-browser-evidence.cjs
      - name: Extra narrow mobile and tablet responsive qualification
        if: success()
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0i-viewport-evidence.cjs
      - name: Independent customer and admin route regression
        if: success()
        env:
          NODE_PATH: /tmp/octalve-playwright/node_modules
          OCTALVE_BASE_URL: http://127.0.0.1:3000
        run: node scripts/phase-0uvw-browser-evidence.cjs
      - name: Upload browser evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-0c-browser-evidence
          path: |
            artifacts/phase-0c/
            artifacts/phase-0i-viewports/
            artifacts/phase-0uvw/
            artifacts/phase-0x-walkthrough/
            artifacts/phase-0y-navigation/
            artifacts/phase-0y1-navbar/
            artifacts/phase-0i-dialog-scroll/
            artifacts/phase-0z02-shared-domain/
            artifacts/z02-domain/
            artifacts/z03-lifecycle/
            artifacts/z04-access/
          if-no-files-found: warn
          retention-days: 14
