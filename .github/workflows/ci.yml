name: Baseline CI
on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline
        shell: bash
        run: |
          test -f docs/project/state.json
          test -f docs/project/SECURITY_BASELINE.md
          if [ -f package.json ]; then
            echo 'Application source exists: subsequent qualification workflow must enforce install, typecheck, lint, tests and build.'
          else
            echo 'Documentation bootstrap only; application qualification NOT RUN.'
          fi
